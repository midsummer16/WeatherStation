[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER
    -DTFT_CS=18
    -DTFT_DC=16
    -DTFT_RST=4
    -DTFT_MISO=5
    -DTFT_MOSI=23
    -DTFT_SCLK=15
    -DTFT_SPI_PORT=VSPI
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
lib_deps =
    robtillaart/SHT2x@^0.5.5
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.1
